name: GitHub Trends Collector & Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily.yml"
      - "ghtrend.py"
      - "web.py"
      - "build_site.py"
      - "web/**"
      - "tests/**"
  schedule:
    # Every two hours at minute 17 (UTC); GitHub may delay scheduled jobs.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum repositories to discover/update"
        required: false
        default: "30"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect data and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Restore previous SQLite database
        uses: actions/cache/restore@v4
        with:
          path: ghtrend.sqlite3
          key: github-trends-db-${{ github.run_id }}
          restore-keys: |
            github-trends-db-

      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js

      - name: Collect repositories and Star history
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TREND_TOKEN || github.token }}
        run: |
          LIMIT="${{ inputs.limit || '30' }}"
          python ghtrend.py update --limit "$LIMIT"

      - name: Checkpoint SQLite database
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("ghtrend.sqlite3")
          try:
              db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          finally:
              db.close()
          PY

      - name: Generate leaderboard report
        run: |
          python ghtrend.py report > daily-report.txt
          cat daily-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save updated SQLite database
        uses: actions/cache/save@v4
        with:
          path: ghtrend.sqlite3
          key: github-trends-db-${{ github.run_id }}

      - name: Build GitHub Pages static website
        run: python build_site.py --db ghtrend.sqlite3 --output dist --limit 500

      - name: Upload report and SQLite snapshot
        uses: actions/upload-artifact@v4
        with:
          name: github-trends-${{ github.run_id }}
          path: |
            daily-report.txt
            ghtrend.sqlite3
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4
